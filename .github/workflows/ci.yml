name: Portable verification

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  portable-checks:
    name: Python 3.12 portable checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install locked portable environment
        run: uv sync --frozen --extra dashboard

      - name: Run portable tests
        run: uv run --frozen --no-sync pytest -q -m "not integration"

      - name: Check formatting and lint
        run: |
          uv run --frozen --no-sync ruff format --check .
          uv run --frozen --no-sync ruff check .

      - name: Run strict type checks
        run: uv run --frozen --no-sync mypy src
